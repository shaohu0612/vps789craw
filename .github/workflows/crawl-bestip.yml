name: VPS789 Crawl Best IP

on:
  schedule:
    # 默认每 12 小时 30 分运行一次 (与域名采集错峰运行)
    - cron: '30 */12 * * *'
  workflow_dispatch:
    inputs:
      enabled:
        description: '是否启用并执行优选 IP 采集任务'
        required: true
        type: boolean
        default: true

# 授予写入仓库内容的权限
permissions:
  contents: write

jobs:
  crawl-and-update-bestip:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.enabled }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出仓库代码 (原生 Git)
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git clone --depth=1 "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" .

      - name: 安装 Python 依赖
        run: |
          python3 -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: 执行优选 IP 采集
        run: |
          python3 -m crawler.main --type ip --bestip-file vps789-bestip

      - name: 检查并提交变更
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || github.token }}
        run: |
          TOTAL_LINES=$(wc -l < vps789-bestip || echo 0)
          echo "### 📊 VPS789 优选 IP 采集报告" >> $GITHUB_STEP_SUMMARY
          echo "- **采集时间**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **有效节点总数**: ${TOTAL_LINES} 条" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "$(git status --porcelain vps789-bestip)" ]; then
            echo "检测到 vps789-bestip 产生更新，准备提交变更..."
            git add vps789-bestip
            git commit -m "chore(ip): 定时更新 vps789-bestip 优选 IP 列表 [skip ci]"
            git push origin HEAD:main
            echo "✅ **更新状态**: 数据有变化，已自动提交并推送到 main 分支。" >> $GITHUB_STEP_SUMMARY
            echo "优选 IP 列表更新并推送成功！"
          else
            echo "ℹ️ **更新状态**: 远程节点数据与仓库一致，无需产生重复空提交。" >> $GITHUB_STEP_SUMMARY
            echo "vps789-bestip 无内容变化，跳过提交。"
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "#### 🔍 前 5 条数据预览:" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          head -n 5 vps789-bestip >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
