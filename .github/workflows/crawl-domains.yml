name: VPS789 Crawl Domains

on:
  schedule:
    # 默认每 6 小时整点运行一次 (UTC 时间 0点、6点、12点、18点，对应北京时间 8点、14点、20点、次日2点)
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      enabled:
        description: '是否启用并执行域名采集任务'
        required: true
        type: boolean
        default: true

# 授予写入仓库内容的权限
permissions:
  contents: write

jobs:
  crawl-and-update-domains:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.enabled }}
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行优选域名采集
        run: |
          python -m crawler.main --type domain --domains-file vps789-domains

      - name: 检查并提交变更
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          
          if [ -n "$(git status --porcelain vps789-domains)" ]; then
            echo "检测到 vps789-domains 产生更新，准备提交变更..."
            git add vps789-domains
            git commit -m "chore(domain): 定时更新 vps789-domains 优选域名列表"
            git pull --rebase origin main || true
            git push origin main
            echo "优选域名列表更新并推送成功！"
          else
            echo "vps789-domains 无内容变化，跳过提交。"
          fi
